services:
  backend:
    build:
      context: ./python-app
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/backend:${IMAGE_TAG}
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/nginx:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
